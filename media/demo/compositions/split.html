            <div class="b bot card" id="r2"><span class="sender">Корсик</span><span class="tk-title">🔴 Красный флаг, обращение #5: травля и давление</span><span class="tk-meta">Смирнов Иван · GTP · день 3</span><span class="tk-q">«Мастер угрожает, что уволит меня, если пожалуюсь на сломанный защитный кожух станка»</span><span class="tk-st"><span class="new" id="r2-new">Видит только HR</span><span class="work" id="r2-work">В работе: Петрова О.</span></span></div>

  <script>
    // Буквы для строки ввода новичка: каждая отдельным span, показываем по таймлайну
    const MSG = {
      1: "Когда зарплата?",
      2: "Можно ли приходить с собакой?",
      3: "Мастер угрожает, что уволит меня, если пожалуюсь на сломанный защитный кожух станка",
      4: "А с собакой на завод можно?",
    };
    for (const k of Object.keys(MSG)) {
      const box = document.getElementById("ibm" + k);
      for (const ch of MSG[k]) {
        const s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        box.appendChild(s);
      }
    }

    document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });
      const $ = (q) => document.querySelector(q);
      const PAD = 26;
      function bottomIn(feed, el) {
        let y = 0;
        let n = el;
        while (n && n !== feed) {
          y += n.offsetTop;
          n = n.offsetParent;
        }
        return y + el.offsetHeight;
      }
      const VH = { la: $("#la").parentElement.clientHeight, lb: $("#lb").parentElement.clientHeight, ra: $("#ra").parentElement.clientHeight };
      const T = {};
      const feedOf = {};
      for (const id of ["ld1", "l1", "l2k", "l3", "l4t", "l4k", "l5", "l6t", "l6", "l7", "ld3", "l8", "l9t", "l9", "l10"]) feedOf[id] = "la";
      for (const id of ["lb1", "lb2t", "lb2k"]) feedOf[id] = "lb";
      for (const id of ["r0", "r1k", "r2k"]) feedOf[id] = "ra";
      for (const id of Object.keys(feedOf)) {
        const f = feedOf[id];
        T[id] = VH[f] - PAD - bottomIn($("#" + f), $("#" + id));
      }
      const pos = { la: T.ld1, lb: T.lb1, ra: T.r0 };
      function scrollTo(id, t) {
        const f = feedOf[id];
        tl.fromTo("#" + f, { y: pos[f] }, { y: T[id], duration: 0.7, ease: "power2.inOut", immediateRender: false }, t);
        pos[f] = T[id];
      }
      function capIn(id, t) {
        tl.fromTo(id + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, stagger: 0.05, ease: "power1.out" }, t);
      }
      function capOut(id, t) {
        tl.fromTo(id + " .w", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in", immediateRender: false }, t);
      }
      function bubbleIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 20, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, t);
      }
      function cardIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 14, scale: 0.98, filter: "blur(4px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, t);
      }
      function sendIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 110, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
      }
      function typing(id, t0, t1) {
        tl.fromTo(id, { opacity: 0, y: 12, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo("#ls-b", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t0);
        tl.fromTo("#ls-a", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t0);
        const reps = Math.max(1, Math.floor((t1 - t0 - 0.2) / 0.6) * 2 - 1);
        tl.fromTo(id + " i", { y: 0, opacity: 0.55 }, { y: -8, opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: reps, stagger: 0.15 }, t0 + 0.12);
        tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, t1);
        tl.fromTo("#ls-b", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t1);
        tl.fromTo("#ls-a", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t1);
      }
      function userType(n, t0, tPress, tSend) {
        const chs = document.querySelectorAll("#ibm" + n + " .c");
        const span = (tPress - 0.1 - t0) / chs.length;
        // меряем, где кончается каждая буква, чтобы сдвигать текст влево, когда он не влезает
        chs.forEach((c) => (c.style.display = "inline"));
        const room = $("#ibt").parentElement.clientWidth - 44 - 8;
        const rights = Array.from(chs).map((c) => c.offsetLeft + c.offsetWidth);
        chs.forEach((c) => (c.style.display = ""));
        let shift = 0;
        tl.fromTo("#ib-ph", { opacity: 1 }, { opacity: 0, duration: 0.1, immediateRender: false }, t0);
        tl.fromTo("#ib-caret", { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, t0);
        tl.fromTo("#ib-send-on", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t0 + 0.1);
        let t = t0;
        chs.forEach((c, i) => {
          tl.set(c, { display: "inline" }, t);
          const need = Math.min(0, room - rights[i]);
          if (need !== shift) {
            tl.set("#ibt", { x: need }, t);
            shift = need;
          }
          t += span * (1 + 0.35 * Math.sin(i * 1.7 + n));
        });
        if (shift !== 0) tl.set("#ibt", { x: 0 }, tSend);
        tl.fromTo("#ib-send", { scale: 1 }, { scale: 0.86, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, tPress);
        tl.set("#ibm" + n, { display: "none" }, tSend);
        tl.fromTo("#ib-caret", { opacity: 1 }, { opacity: 0, duration: 0.08, immediateRender: false }, tSend);
        tl.fromTo("#ib-send-on", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, tSend);
        tl.fromTo("#ib-ph", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tSend + 0.05);
      }
      function press(id, t) {
        tl.fromTo(id, { scale: 1, backgroundColor: "#ffffff" }, { scale: 0.93, backgroundColor: "#dcebfa", duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, t);
      }
      function sweep(id, t) {
        tl.fromTo(id, { xPercent: -110 }, { xPercent: 210, duration: 0.9, ease: "power2.inOut" }, t);
      }
      function swapStatus(prefix, t) {
        tl.fromTo(prefix + "-new", { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, t);
        tl.fromTo(prefix + "-work", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t + 0.1);
      }

      // Начальные состояния
      tl.set("#la", { y: pos.la }, 0);
      tl.set("#lb", { y: pos.lb }, 0);
      tl.set("#ra", { y: pos.ra }, 0);
      tl.set("#sheet", { yPercent: 105 }, 0);

      // 0 · появление
      tl.fromTo("#d-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#lw-in", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0);
      tl.fromTo("#rw-in", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.15);
      tl.fromTo(".who-lbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.15 }, 0.3);
      capIn("#c0", 0.3);

      // 1 · шаги приходят сами
      bubbleIn("#ld1", 1.0);
      scrollTo("l1", 1.3);
      bubbleIn("#l1", 1.35);
      capOut("#c0", 2.4);
      capIn("#c1", 2.6);
      scrollTo("l2k", 3.0);
      bubbleIn("#l2", 3.05);
      bubbleIn("#l2k", 3.25);

      // 2 · свой вопрос, ответ пунктом документа
      capOut("#c1", 5.4);
      capIn("#c2", 5.6);
      userType(1, 5.5, 6.35, 6.5);
      scrollTo("l3", 6.45);
      sendIn("#l3", 6.5);
      scrollTo("l4t", 7.0);
      typing("#l4t", 7.05, 8.1);
      scrollTo("l4k", 8.05);
      cardIn("#l4", 8.15);
      bubbleIn("#l4k", 8.4);
      sweep("#l4s", 8.8);

      // 3 · нет в документах: вопрос у HR, ответ в базу
      capOut("#c2", 10.3);
      capIn("#c3", 10.5);
      userType(2, 10.2, 11.35, 11.5);
      scrollTo("l5", 11.45);
      sendIn("#l5", 11.5);
      scrollTo("l6t", 11.95);
      typing("#l6t", 12.0, 12.8);
      scrollTo("l6", 12.75);
      cardIn("#l6", 12.85);
      tl.fromTo("#rd", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 13.0);
      scrollTo("r1k", 13.05);
      tl.fromTo("#r1", { opacity: 0, y: 20, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 13.1);
      bubbleIn("#r1k", 13.3);
      press("#r1-open", 14.4);
      tl.fromTo("#sheet-scrim", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, 14.6);
      tl.fromTo("#sheet", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 14.6);
      capOut("#c3", 14.9);
      capIn("#c3b", 15.1);
      tl.fromTo(".sh-input .tw", { opacity: 0 }, { opacity: 1, duration: 0.1, stagger: 0.1, ease: "power1.out" }, 15.4);
      tl.fromTo("#sh-track-on", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, 16.6);
      tl.fromTo("#sh-knob", { x: 0 }, { x: 28, duration: 0.35, ease: "power3.inOut" }, 16.6);
      tl.fromTo("#sh-send", { scale: 1 }, { scale: 0.88, duration: 0.11, ease: "power2.in", yoyo: true, repeat: 1 }, 17.1);
      tl.fromTo("#sheet", { yPercent: 0 }, { yPercent: 105, duration: 0.45, ease: "power3.in", immediateRender: false }, 17.35);
      tl.fromTo("#sheet-scrim", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 17.4);
      swapStatus("#r1", 17.75);
      scrollTo("l7", 17.75);
      bubbleIn("#l7", 17.8);

      // 4 · тревожный сигнал
      capOut("#c3b", 19.4);
      capIn("#c4", 19.6);
      scrollTo("ld3", 19.4);
      bubbleIn("#ld3", 19.45);
      userType(3, 19.55, 21.1, 21.25);
      scrollTo("l8", 21.2);
      sendIn("#l8", 21.25);
      scrollTo("r2k", 21.6);
      tl.fromTo("#r2", { opacity: 0, y: 20, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 21.65);
      bubbleIn("#r2k", 21.85);
      tl.fromTo("#r2", { boxShadow: "0 0 0 0 rgba(198,40,40,0)" }, { boxShadow: "0 0 0 10px rgba(198,40,40,0.18)", duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 22.2);
      scrollTo("l9t", 21.8);
      typing("#l9t", 21.85, 22.6);
      scrollTo("l9", 22.55);
      cardIn("#l9", 22.65);
      press("#r2-take", 24.0);
      swapStatus("#r2", 24.2);
      scrollTo("l10", 25.6);
      bubbleIn("#l10", 25.65);

      // 5 · следующему новичку бот отвечает сам
      capOut("#c4", 28.3);
      capIn("#c5", 28.5);
      tl.fromTo("#la", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power2.in", immediateRender: false }, 28.3);
      tl.fromTo("#lb", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out", immediateRender: false }, 28.55);
      tl.set(["#lb1", "#lb2", "#lb2k"], { opacity: 0 }, 0);
      userType(4, 28.9, 29.95, 30.1);
      sendIn("#lb1", 30.1);
      scrollTo("lb2t", 30.6);
      typing("#lb2t", 30.65, 31.3);
      scrollTo("lb2k", 31.25);
      cardIn("#lb2", 31.35);
      bubbleIn("#lb2k", 31.6);
      sweep("#lb2s", 32.0);
      tl.fromTo("#rw-in", { opacity: 1 }, { opacity: 0.55, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 30.6);

      // 6 · итог
      capOut("#c5", 34.4);
      capIn("#c6", 34.6);
      tl.fromTo("#rw-in", { opacity: 0.55 }, { opacity: 1, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 34.6);

      window.__timelines["split"] = tl;
    });
  </script>
</template>
