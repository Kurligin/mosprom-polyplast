  <script>
    // Буквы для строки ввода новичка: каждая отдельным span, показываем по таймлайну
    const MSG = {
      2: "Можно ли приходить с собакой?",
      5: "Мне не начислили сверхурочные за субботу",
      3: "Мастер угрожает, что уволит меня, если пожалуюсь на сломанный защитный кожух станка",
      4: "А с собакой на завод можно?",
    };
    for (const k of Object.keys(MSG)) {
      const box = document.getElementById("ibm" + k);
      for (const ch of MSG[k]) {
        const s = document.createElement("span");
        s.className = "c";
        s.textContent = ch;
        box.appendChild(s);
      }
    }
    // Волна голосового: фиксированные высоты, чтобы кадр был детерминирован
    const WAVE = [10, 18, 26, 14, 30, 22, 12, 24, 32, 16, 20, 28, 12, 22, 30, 18, 10, 24, 16, 12];
    function wave(id, n) {
      const box = document.getElementById(id);
      for (let i = 0; i < n; i++) {
        const b = document.createElement("i");
        b.style.height = WAVE[i % WAVE.length] + "px";
        box.appendChild(b);
      }
    }
    wave("l3w", 20);
    wave("recw", 14);

    document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });
      const $ = (q) => document.querySelector(q);
      const PAD = 26;
      function bottomIn(feed, el) {
        let y = 0;
        let n = el;
        while (n && n !== feed) {
          y += n.offsetTop;
          n = n.offsetParent;
        }
        return y + el.offsetHeight;
      }

      // Сообщения, которые меняются на месте: высота каждого состояния
      const M = {};
      for (const id of ["lo", "lv", "lsv", "mw"]) {
        const w = $("#" + id);
        const sts = Array.from(w.querySelectorAll(":scope > .ost"));
        const h = sts.map((s) => s.offsetHeight);
        w.style.height = h[h.length - 1] + "px";
        M[id] = { w, sts, h };
      }

      const FEEDS = ["la", "lb", "ta", "ra", "ma"];
      const VH = {};
      for (const f of FEEDS) VH[f] = $("#" + f).parentElement.clientHeight;
      const feedOf = {};
      const put = (f, ids) => ids.forEach((id) => (feedOf[id] = f));
      put("la", ["lo", "ld1", "l1", "l2k", "ltk", "l3", "lv", "l4t", "l4k", "l5", "l6t", "l6", "l7", "ld2", "l11", "l12t", "l12", "ld3", "lsv", "l8", "l9t", "l9", "l10"]);
      put("lb", ["lb1", "lb2t", "lb2k"]);
      put("ta", ["t0", "t1", "t2"]);
      put("ra", ["r0", "r1k", "r2k", "r3k"]);
      put("ma", ["md", "mw"]);
      const T = {};
      for (const id of Object.keys(feedOf)) T[id] = VH[feedOf[id]] - PAD - bottomIn($("#" + feedOf[id]), $("#" + id));
      // положение ленты для каждого состояния меняющегося сообщения
      function yState(id, k) {
        const m = M[id];
        const f = feedOf[id];
        const top = bottomIn($("#" + f), m.w) - m.w.offsetHeight;
        return VH[f] - PAD - (top + m.h[k]);
      }
      const pos = { la: yState("lo", 0), lb: T.lb1, ta: T.t0, ra: T.r0, ma: yState("mw", 0) };

      function scrollY(f, y, t, d = 0.7) {
        tl.fromTo("#" + f, { y: pos[f] }, { y, duration: d, ease: "power2.inOut", immediateRender: false }, t);
        pos[f] = y;
      }
      const scrollTo = (id, t) => scrollY(feedOf[id], T[id], t);

      function capIn(id, t) {
        tl.fromTo(id + " .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, stagger: 0.05, ease: "power1.out" }, t);
      }
      function capOut(id, t) {
        tl.fromTo(id + " .w", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in", immediateRender: false }, t);
      }
      function cap(id, tIn, tOut) {
        capIn(id, tIn);
        if (tOut) capOut(id, tOut);
      }
      function bubbleIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 20, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, t);
      }
      function cardIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 14, scale: 0.98, filter: "blur(4px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, t);
      }
      function sendIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 110, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
      }
      function typing(id, t0, t1) {
        tl.fromTo(id, { opacity: 0, y: 12, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, t0);
        tl.fromTo("#ls-b", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t0);
        tl.fromTo("#ls-a", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t0);
        const reps = Math.max(1, Math.floor((t1 - t0 - 0.2) / 0.6) * 2 - 1);
        tl.fromTo(id + " i", { y: 0, opacity: 0.55 }, { y: -8, opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: reps, stagger: 0.15 }, t0 + 0.12);
        tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, t1);
        tl.fromTo("#ls-b", { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, t1);
        tl.fromTo("#ls-a", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t1);
      }
      function userType(n, t0, tPress, tSend) {
        const chs = document.querySelectorAll("#ibm" + n + " .c");
        const span = (tPress - 0.1 - t0) / chs.length;
        chs.forEach((c) => (c.style.display = "inline"));
        const fld = $("#ibt").parentElement;
        const fs = getComputedStyle(fld);
