  <script>
    // Ленту чата прижимаем к низу окна, как в мессенджере: для этого меряем высоты сообщений
    // после загрузки шрифтов и только потом строим таймлайн.
    document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });
      const S = 0.067; // шаг между словами
      const PAD = 30;
      const $ = (q) => document.querySelector(q);
      const VH = $("#fa").parentElement.clientHeight;
      function bottomIn(feed, el) {
        let y = 0;
        let n = el;
        while (n && n !== feed) {
          y += n.offsetTop;
          n = n.offsetParent;
        }
        return y + el.offsetHeight;
      }
      // Положение ленты, при котором сообщение стоит внизу окна
      const T = {};
      for (const id of ["a1", "a2", "a3-btn", "a4", "a5", "a6", "a7"]) T[id] = VH - PAD - bottomIn($("#fa"), $("#" + id));
      for (const id of ["b1", "b2", "b3-btn"]) T[id] = VH - PAD - bottomIn($("#fb"), $("#" + id));

      const pos = { fa: T.a1, fb: T.b1 };
      function scrollTo(feed, id, t) {
        tl.fromTo("#" + feed, { y: pos[feed] }, { y: T[id], duration: 0.45, ease: "power3.out", immediateRender: false }, t);
        pos[feed] = T[id];
      }

      // Фон: кольцо трубы медленно вращается весь ролик (3° в секунду)
      tl.fromTo("#c-dash", { rotation: 0, svgOrigin: "450 450" }, { rotation: 69, duration: 23, ease: "none" }, 0);

      function capIn(id, t) {
        tl.fromTo(`${id} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: S, ease: "power2.out" }, t);
      }
      function capOut(id, t) {
        tl.fromTo(`${id} .w`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", immediateRender: false }, t);
      }
      function bubbleIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, t);
      }
      function typing(id, t0, t1) {
        tl.fromTo(id, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, t0);
        tl.fromTo("#st-typing", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t0);
        tl.fromTo("#st-bot", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, t0);
        const reps = Math.max(1, Math.floor((t1 - t0 - 0.2) / 0.44) * 2 - 1);
        tl.fromTo(`${id} i`, { y: 0 }, { y: -9, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: reps, stagger: 0.11 }, t0 + 0.1);
        tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, t1);
        tl.fromTo("#st-typing", { opacity: 1 }, { opacity: 0, duration: 0.15, immediateRender: false }, t1);
        tl.fromTo("#st-bot", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, t1);
      }
      function cardIn(id, t) {
        tl.fromTo(id, { opacity: 0, scale: 0.94, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, t);
      }
      function sweep(id, t) {
        tl.fromTo(id, { xPercent: -110 }, { xPercent: 210, duration: 0.7, ease: "power2.inOut" }, t);
      }

      // Начальные состояния
      tl.set("#fa", { y: T.a1 }, 0);
      tl.set("#fb", { y: T.b1, opacity: 0 }, 0);
      tl.set(["#c-hr", "#c-final h1 .w", "#c-final-sub", "#hr-track-on", ".hr-input .tw"], { opacity: 0 }, 0);

      // 0 · окно чата и надзаголовок
      tl.fromTo("#c-win-in", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0);
      tl.fromTo("#c-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.15);

      // 1 · вопрос новичка
      capIn("#cap1", 0.4);
      bubbleIn("#a1", 0.9);

      // 2 · ищет в документах
      scrollTo("fa", "a2", 1.6);
      typing("#a2", 1.6, 4.5);
      capOut("#cap1", 2.7);
      capIn("#cap2", 2.85);

      // 3 · ответ дословным пунктом с источником
      scrollTo("fa", "a3-btn", 4.5);
      cardIn("#a3", 4.55);
      bubbleIn("#a3-btn", 4.75);
      capOut("#cap2", 4.9);
      capIn("#cap3", 5.05);
      sweep("#a3-sweep", 5.5);

      // 4 · вопрос вне документов: честное «не знаю»
      capOut("#cap3", 7.6);
      capIn("#cap4", 7.75);
      scrollTo("fa", "a4", 7.85);
      bubbleIn("#a4", 7.9);
      scrollTo("fa", "a5", 8.4);
      typing("#a5", 8.4, 9.4);
      scrollTo("fa", "a6", 9.4);
      cardIn("#a6", 9.45);

      // 5 · HR отвечает, ответ в базу
      tl.fromTo("#c-hr", { opacity: 0, x: 50, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", immediateRender: false }, 10.1);
