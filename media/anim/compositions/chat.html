          n = n.offsetParent;

        return y + el.offsetHeight;
      }
      const T = {};

        tl.fromTo("#" + feed, { y: pos[feed] }, { y: T[id], duration: 0.8, ease: "power2.inOut", immediateRender: false }, t);

      // Подпись: слова мягко проявляются из размытия, уходят всей строкой
      function capIn(id, t) {
        tl.fromTo(`${id} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, stagger: 0.06, ease: "power1.out" }, t);
      }
      function capOut(id, t) {
        tl.fromTo(`${id} .w`, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "power2.in", immediateRender: false }, t);
      }
      // Пузырь: приходит медленно, с длинным хвостом
      function bubbleIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 20, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, t);
      }
      function cardIn(id, t) {
        tl.fromTo(id, { opacity: 0, y: 14, scale: 0.98, filter: "blur(4px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, t);
      }
      // «печатает…»: точки плавно качаются, статус в шапке меняется
      function typing(id, t0, t1) {
        tl.fromTo(id, { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, t0);
        tl.fromTo("#st-typing", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.inOut", immediateRender: false }, t0);
        tl.fromTo("#st-bot", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.inOut", immediateRender: false }, t0);
        const reps = Math.max(1, Math.floor((t1 - t0 - 0.2) / 0.6) * 2 - 1);
        tl.fromTo(`${id} i`, { y: 0, opacity: 0.55 }, { y: -9, opacity: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: reps, stagger: 0.15 }, t0 + 0.15);
        tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, t1);
        tl.fromTo("#st-typing", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.inOut", immediateRender: false }, t1);
        tl.fromTo("#st-bot", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.inOut", immediateRender: false }, t1);
      }
      function sweep(id, t) {
        tl.fromTo(id, { xPercent: -110 }, { xPercent: 210, duration: 0.9, ease: "power2.inOut" }, t);
      }
      // Шаги: линия дотягивается до узла, узел загорается
      let fillAt = 0;
      function step(n, t) {
        const to = (n - 1) / 4;
        if (to > fillAt) {
          tl.fromTo("#st-fill", { scaleX: fillAt }, { scaleX: to, duration: 0.7, ease: "power2.inOut", immediateRender: false }, t - 0.5);
          fillAt = to;
        }
        tl.fromTo(`#n${n} .on`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo(`#n${n} .lbl`, { color: "#545f72" }, { color: "#0b1b3f", duration: 0.3, immediateRender: false }, t);
      }

      // Начальные состояния
      tl.set("#fa", { y: T.a1 }, 0);
      tl.set("#fb", { y: T.b1 }, 0);
      tl.set("#st-fill", { scaleX: 0 }, 0);


      // 0 · появление
      tl.fromTo("#c-win-in", { opacity: 0, y: 60, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 1.1, ease: "power3.out" }, 0);
      tl.fromTo("#c-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#c-steps", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);

      // 1 · вопрос новичка
      capIn("#cap1", 0.4);
      step(1, 0.9);
      bubbleIn("#a1", 0.9);

      // 2 · ищет в документах
      scrollTo("fa", "a2", 1.55);
      typing("#a2", 1.6, 4.4);
      capOut("#cap1", 2.7);
      capIn("#cap2", 2.95);

      // 3 · ответ дословным пунктом с источником
      scrollTo("fa", "a3-btn", 4.4);
      cardIn("#a3", 4.5);
      bubbleIn("#a3-btn", 4.75);
      step(2, 4.6);
      capOut("#cap2", 4.9);
      capIn("#cap3", 5.15);
      sweep("#a3-sweep", 5.6);

      // 4 · вопрос вне документов: честное «не знаю»
      capOut("#cap3", 7.6);
      capIn("#cap4", 7.85);
      scrollTo("fa", "a4", 7.85);
      bubbleIn("#a4", 7.9);
      scrollTo("fa", "a5", 8.45);
      typing("#a5", 8.5, 9.4);
      scrollTo("fa", "a6", 9.35);
      cardIn("#a6", 9.45);
      step(3, 9.55);

      // 5 · HR отвечает, ответ в базу
      tl.fromTo("#c-hr", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out", immediateRender: false }, 10.1);
      capOut("#cap4", 10.3);
      capIn("#cap5", 10.55);
      tl.fromTo(".hr-input .tw", { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.11, ease: "power1.out", immediateRender: false }, 10.8);
      tl.fromTo("#hr-track-on", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut", immediateRender: false }, 11.9);
      tl.fromTo("#hr-knob", { x: 0 }, { x: 28, duration: 0.4, ease: "power3.inOut" }, 11.9);
      tl.fromTo("#hr-send", { scale: 1 }, { scale: 0.9, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1 }, 12.35);
      scrollTo("fa", "a7", 12.5);
      bubbleIn("#a7", 12.6);
      step(4, 12.7);

      // 6 · следующему новичку бот отвечает сам
      capOut("#cap5", 14.85);
      tl.fromTo("#c-hr", { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: 20, filter: "blur(6px)", duration: 0.4, ease: "power2.in", immediateRender: false }, 14.85);
      tl.fromTo("#fa", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.35, ease: "power2.in", immediateRender: false }, 14.9);
      tl.fromTo("#fb", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out", immediateRender: false }, 15.0);
      capIn("#cap6", 15.05);
      bubbleIn("#b1", 15.45);
      scrollTo("fb", "b2", 16.05);
      typing("#b2", 16.1, 16.8);
      scrollTo("fb", "b3-btn", 16.75);
      cardIn("#b3", 16.85);
      bubbleIn("#b3-btn", 17.1);
      step(5, 17.0);
      sweep("#b3-sweep", 17.45);

      // 7 · итог
      capOut("#cap6", 19.4);
      tl.fromTo("#c-final .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, stagger: 0.07, ease: "power2.out", immediateRender: false }, 19.65);
      tl.fromTo("#c-final-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out", immediateRender: false }, 20.1);

      window.__timelines["chat"] = tl;
    });
  </script>
</template>
