# Явное имя проекта: каталог назван кириллицей, без него compose не стартует
name: korsik

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: korsik
      POSTGRES_PASSWORD: korsik
      POSTGRES_DB: korsik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korsik -d korsik"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    volumes:
      - .:/code
      - models:/models
    working_dir: /code
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8000:8000"
    restart: unless-stopped

  miniapp:
    image: node:22-alpine
    working_dir: /miniapp
    volumes:
      - ./miniapp:/miniapp
      - miniapp_node_modules:/miniapp/node_modules
    environment:
      API_PROXY_TARGET: http://app:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  pgdata:
  miniapp_node_modules:
  models:
