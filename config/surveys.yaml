# Опросы «Корсика» — дословно по ТЗ (docs/korsik-scenario.md, data/raw/korsik_scenario.xlsx).
#
# steps — номера шагов сценария (StepSpec.number, строки 1..68), которые покрывает опрос:
#   движок сценария на любом из них вызывает app.surveys.engine.start_survey (повторный вызов ничего не делает).
# image — картинка шага из assets/ на карточке опроса (первое сообщение, сохраняется при правках).
# Вопрос:
#   kind: choice | yes_no | scale | multi | choice_other | open
#   step — шаг сценария, откуда текст; topic — тема из списка app.llm.gigachat.TOPICS;
#   sites — только для этих площадок; legend — подпись шкалы; reason_below — оценка ниже → «Что мешает?».
# Вариант ответа:
#   reply — ответ Корсика из ТЗ; ask — после выбора ждём текст:
#     reason — «Что мешает?», other — «Свой вариант», why — reply сам задаёт вопрос, problem — текст уходит в обращение;
#   actions — кнопки: recruiter / hr (обращение «просит связаться»), forward / forward_hr (текст → обращение),
#     remind_access (напомнить руководителю про доступы); label — своя подпись кнопки;
#   flag — флаг при выборе: {level: red | yellow, topic, notice: false — без сообщения «передал HR»};
#   mood — positive | neutral | negative (для сводки); exclusive — в мультивыборе снимает остальные.
# Тексты вопросов — дословно; убраны только служебные пометки ТЗ («(да/нет)», «+ поле для комментария»).

surveys:
  - code: day1
    title: Доступы в первый день
    steps: [20, 21]
    remind: false
    outro: ""
    questions:
      - key: d1_access
        step: 20
        sites: [GrPP, Luzhniki]
        kind: yes_no
        topic: доступы
        text: |-
          Тебе предстоит многое узнать о нашей компании. Но сначала решим пару организационных вопросов.

          На твоем рабочем месте тебя будет ждать необходимая техника. Для тебя уже заведена учетная запись и доступы IT. Есть ли у тебя все необходимые доступы и материалы?
        options:
          - label: Да, все есть
            mood: positive
            reply: Замечательно! Тогда пока осваивайся, а я напишу тебе чуть позже.
          - label: Нет
            mood: negative
            reply: Ничего страшного! В таком случае лучше всего уточнить у твоего руководителя, когда будут заведены доступы и предоставлены необходимые материалы.
            actions: [remind_access]
      - key: d1_access_gtp
        step: 21
        sites: [GTP]
        kind: yes_no
        topic: доступы
        text: |-
          Тебе предстоит многое узнать о нашей компании. Но сначала решим пару организационных вопросов.

          К вашему первому рабочему дню мы подготовили рабочее место и необходимое оборудование. Всё настроено для начала работы. Все ли необходимое у вас в наличии?
        options:
          - label: Да, все есть
            mood: positive
            reply: Замечательно! Тогда пока осваивайся, а я напишу тебе чуть позже.
          - label: Нет
            mood: negative
            reply: Ничего страшного! В таком случае лучше всего уточнить у твоего руководителя, когда будут заведены доступы и предоставлены необходимые материалы.
            actions: [remind_access]

  - code: day3
    title: Опрос по итогам третьего рабочего дня
    steps: [36, 37, 38, 39, 40]   # 36 — подводка в том же сообщении, 40 — «Спасибо за обратную связь!» в конце
    intro: Первые пару дней на новом месте могут быть немного сложными, поэтому мы предлагаем пройти тебе опрос, чтобы поделиться с нами своими впечатлениями!
    outro: |-
      Спасибо за обратную связь!
      Увидимся завтра 👋🏻
    questions:
      - key: d3_docs
        step: 37
        kind: choice
        topic: документы
        text: Были ли вопросы при оформлении?
        options:
          - label: Все отлично!
            mood: positive
          - label: Остались вопросы
            mood: neutral
            reply: Хорошо, я тебя понял! Помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы.
            actions: [recruiter]
          - label: Возникли трудности с документами
            mood: negative
            reply: Очень важно иметь возможность полноценно изучить подписываемые документы. Я буду благодарен, если ты поделишься с нами, почему у тебя не получилось этого сделать. В чем заключалась проблема?
            ask: problem
            actions: [recruiter]
      - key: d3_colleagues
        step: 38
        kind: choice
        topic: коллектив
        text: Как тебя встретили новые коллеги?
        options:
          - label: Отлично!
            mood: positive
          - label: Пока присматриваюсь
            mood: neutral
          - label: Никак, все заняты
            mood: negative
            reply: Жалко, что не удалось познакомиться с новыми коллегами. Скорее всего, ты вышел на работу в период большой нагрузки, такое бывает. Но если тебе кажется, что что-то пошло не так, то не бойся поднять этот вопрос со своим руководителем или написать моим коллегам в HR. Мы всегда готовы помочь.
            actions: [forward_hr, hr]
      - key: d3_tasks
        step: 39
        kind: choice
        topic: понимание задач
        text: Понятны ли тебе задачи на испытательный срок?
        options:
          - label: Да, все понятно!
            mood: positive
            reply: Отлично 💪🏻
          - label: Жду разъяснений от руководителя
            mood: neutral
            reply: Хорошо. Если в ближайшее время ты не получишь разъяснения по своим задачам, то лучше всего будет напрямую обсудить этот вопрос с руководителем. Также помни, что ты всегда можешь связаться с рекрутером, описать проблему или задать интересующие тебя вопросы. Мы всегда готовы помочь.
            actions: [recruiter]
          - label: Пока ничего не понял
            mood: negative
            flag: {level: yellow, topic: понимание задач}
            reply: Понимание своих задач на испытательном сроке - ключевой элемент его успешного прохождения. Если у тебя нет четкого представления, в чем будет заключаться твоя работа на ближайшие три месяца, то лучше всего обсудить этот вопрос с руководителем. Если недопонимание так и не прояснилось после общения с руководителем, то ты всегда можешь написать моим коллегам в отдел подбора персонала.
            actions:
              - {do: forward, label: Передать проблему в отдел персонала}
              - recruiter

  - code: week2
    title: Чек через 2 недели
    steps: [45]
    image: img_14.png          # картинка шага 45, остаётся на карточке опроса
    intro: |-
      Привет, Х!
      Хотел узнать, как у тебя дела? Нужна ли помощь с чем-то?
    questions:
      - key: w2_tasks
        step: 45
        kind: yes_no
        topic: понимание задач
        text: Вам понятны поставленные задачи?
        options:
          - {label: Да, mood: positive}
          - {label: Нет, mood: negative, ask: reason}
      - key: w2_info
        step: 45
        kind: yes_no
        topic: понимание задач
        text: Вам достаточно информации для качественного выполнения вашей работы?
        options:
          - {label: Да, mood: positive}
          - {label: Нет, mood: negative, ask: reason}
      - key: w2_manager
        step: 45
        kind: scale
        topic: руководитель
        text: Насколько доступен ваш руководитель для вопросов и обратной связи?
        legend: 1 - недоступен, 10 - всегда доступен
        reason_below: 8
      - key: w2_feedback
        step: 45
        kind: scale
        topic: руководитель
        text: Оцените качество обратной связи от руководителя.
        legend: 1 - отсутствует, 10 – исчерпывающая
        reason_below: 8
      - key: w2_colleagues
        step: 45
        kind: scale
        topic: коллектив
        text: Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе?
        legend: 1 - нет взаимодействия, 10 - отличное взаимодействие
        reason_below: 8
      - key: w2_workplace
        step: 45
        kind: scale
        topic: доступы
        text: Оцените уровень поддержки по вопросам связанным с настройкой и предоставлением доступов/техники/рабочего пространства.
        legend: 1 - низкий, 10 – высокий
        reason_below: 8
      - key: w2_access
        step: 45
        kind: scale
        topic: доступы
        text: Насколько своевременно были предоставлены необходимые доступы.
        legend: 1 - были задержки, 10 - без задержек
        reason_below: 8
      - key: w2_hr
        step: 45
        kind: scale
        topic: другое
        text: Как вы оцениваете качество поддержки от HR по возникающим вопросам?
        legend: 1 - низкое, 10 - очень высокое
        reason_below: 8
      - key: w2_hr_hiring
        step: 45
        kind: scale
        topic: документы
        text: Оцените, пожалуйста, качество поддержки HR в подготовке к трудоустройству?
        legend: 1 - низкое, 10 - очень высокое
        reason_below: 8

  - code: plan
    title: Как идёт работа по адаптационному плану
    steps: [47]
    image: img_07.png
    outro: ""
    questions:
      - key: m1_plan
        step: 47
        kind: choice
        topic: понимание задач
        text: Мы придаём большое значение успешной адаптации новых сотрудников. Подскажи, как идет работа по адаптационному плану?
        options:
          - label: Все хорошо! Продвигаюсь по плану
            mood: positive
            reply: Прекрасно! Тогда, продолжай в том же духе 💪🏻
          - label: Все ок! Немного отстаю от графика
            mood: neutral
            reply: Прекрасно! Тогда, продолжай в том же духе 💪🏻
          - label: Я отстаю от графика.
            mood: negative
            flag: {level: yellow, topic: нагрузка}
            reply: Спасибо за обратную связь! Ты можешь связаться с HR-специалистом с помощью команды /HR или направить сообщение через меня, описав трудности, с которыми ты столкнулся.
            actions: [forward, recruiter]

  - code: month2
    title: Опрос по итогам двух месяцев работы
    steps: [53, 54, 55]       # 53 — GrPP, Luzhniki; 54 — GTP; 55 — ответы Корсика
    outro: Спасибо за обратную связь!
    questions:
      - key: m2_mood
        step: 53
        kind: choice
        topic: нагрузка
        text: С каким настроением ты ежедневно приходишь на работу?
        options:
          - label: С отличным! Мне все нравится!
            mood: positive
          - label: "С безразличным: поработал и ушел"
            mood: neutral
            reply: Очень жаль, что работа не приносит тебе удовольствие. Если я и мои коллеги можем помочь тебе чем-то, направь вопрос в отдел подбора персонала. Мы вместе постараемся придумать решение и сделать твою жизнь на работе комфортнее.
            actions: [forward, recruiter]
          - label: Уже устал, а задачи все валятся
            mood: negative
            flag: {level: yellow, topic: нагрузка}
            reply: |-
              Мы все иногда можем сталкиваться с большим объемом работы, короткими сроками или слишком высокими ожиданиями со стороны руководства и коллег. Все это может создать большое давление и привести к отрицательным последствиям для физического и эмоционального здоровья. 😞
              Состояние эмоционального напряжения не является нормой, и в таком случае я бы рекомендовал обратиться в отдел подбора персонала: описать свою проблему, чтобы мы вместе придумали, как исправить ситуацию и сделать твою жизнь на работе комфортнее.
            actions: [forward, recruiter]
      - key: m2_helpers
        step: 53
        kind: multi
        topic: наставник
        text: Кто тебе помогает в период испытательного срока? (несколько вариантов ответа)
        options:
          - {label: Руководитель, mood: positive}
          - {label: Коллеги, mood: positive}
          - {label: Рекрутер, mood: positive}
          - label: Никто!
            mood: negative
            exclusive: true
            flag: {level: yellow, topic: наставник}
            reply: Поддержка - важная составляющая успешной адаптации. Я всегда готов помочь тебе! Но какие-то вопросы слишком сложные, чтобы я мог решить их самостоятельно. В таких случаях ты всегда можешь обратиться за помощью к рекрутеру.
            actions: [forward, recruiter]
      - key: m2_speedup
        step: 53
        kind: choice_other
        topic: другое
        text: Что помогло бы ускорить твою адаптацию?
        options:
          - {label: Удаленный формат работы, sites: [GrPP, Luzhniki]}
          - {label: Более четкие задачи}
          - {label: Автоматизация процессов}
          - {label: Помощь коллег}
          - {label: Свой вариант, ask: other}

  - code: final
    title: Опрос по итогам испытательного срока
    steps: [60, 61, 62, 63, 64]   # 64 — «Спасибо! Мы обязательно учтем твои рекомендации 💙»
    outro: Спасибо! Мы обязательно учтем твои рекомендации 💙
    questions:
      - key: fin_hardest
        step: 60
        kind: choice_other
        topic: другое
        text: Что было самым сложным в период адаптации?
        options:
          - {label: Со всем справился, mood: positive}
          - {label: Коммуникации с другими отделами, mood: neutral}
          - {label: Нечеткие задачи, mood: negative}
          - {label: Другое, ask: other}
      - key: fin_stay
        step: 61
        kind: choice
        topic: другое
        text: Планируешь ли ты продолжить работу по итогам испытательного срока?
        options:
          - label: Да, однозначно!
            mood: positive
            reply: Мы рады видеть тебя в нашей команде и надеемся, что ты останешься с нами на долгое время! 🎉
          - label: Не уверен
            mood: neutral
            reply: Могу ли я поинтересоваться, в чем причина твоих сомнений по поводу нашей компании?
            ask: why
            actions:
              - {do: recruiter, label: Готов озвучить причину в личной коммуникации с рекрутером}
          - label: Нет, задумываюсь об уходе
            mood: negative
            flag: {level: red, topic: намерение уйти, notice: false}
            reply: Очень жаль, что ты сомневаешься в дальнейшем сотрудничестве с нами. Могу ли я поинтересоваться, что на это повлияло?
            ask: why
            actions:
              - {do: recruiter, label: Готов озвучить причину в личной коммуникации с рекрутером}
      - key: fin_load
        step: 62
        kind: scale
        topic: нагрузка
        text: Оцените уровень нагрузки по задачам
        legend: 1 - очень некомфортная, 10 - полностью комфортная
        reason_below: 8
      - key: fin_expectations
        step: 62
        kind: scale
        topic: другое
        text: Насколько ваши ожидания от работы совпадают с реальностью
        legend: 1 - разочаровали, 10 - превзошли ожидания
        reason_below: 8
      - key: fin_info
        step: 62
        kind: yes_no
        topic: понимание задач
        text: Вам достаточно информации для качественного выполнения вашей работы?
        options:
          - {label: Да, mood: positive}
          - {label: Нет, mood: negative, ask: reason}
      - key: fin_manager
        step: 62
        kind: scale
        topic: руководитель
        text: Насколько доступен ваш руководитель для вопросов и обратной связи?
        legend: 1 - недоступен, 10 - всегда доступен
        reason_below: 8
      - key: fin_feedback
        step: 62
        kind: scale
        topic: руководитель
        text: Оцените качество обратной связи от руководителя.
        legend: 1 - отсутствует, 10 – исчерпывающая
        reason_below: 8
      - key: fin_colleagues
        step: 62
        kind: scale
        topic: коллектив
        text: Насколько ваши коллеги оказывают поддержку при появлении вопросов или сложностей в работе
        legend: 1 - нет взаимодействия, 10 - отличное взаимодействие
        reason_below: 8
      - key: fin_depts
        step: 62
        kind: scale
        topic: коллектив
        text: Как вы оцениваете ваше взаимодействие с другими подразделениями
        legend: 1-плохо 10-отличное взаимодействие
        reason_below: 8
      - key: fin_hr
        step: 62
        kind: scale
        topic: другое
        text: Как вы оцениваете качество поддержки от HR по возникающим вопросам?
        legend: 1 - низкое, 10 - очень высокое
        reason_below: 8
      - key: fin_goals
        step: 62
        kind: scale
        topic: понимание задач
        text: Насколько вам удалось реализовать поставленные на испытательный срок задачи
        legend: 1 – совсем не удалось, 10 – удалось полностью
        reason_below: 8
      - key: fin_improve
        step: 63
        kind: open
        topic: другое
        text: Что порекомендуешь улучшить для более комфортной адаптации сотрудника?
