# Словарь флагов (app/signals/rules.py). Работает всегда, без LLM.
#
# Текст приводится к нижнему регистру, «ё» → «е». Все выражения — регулярки Python.
#   stems    — основы слов с начала слова; если за 1–2 слова до основы стоит «не / ни / нет»
#              или сразу после — «нет» — не считается («никто не угрожает», «угроз никаких нет»);
#   patterns — фразы как есть, отрицание в них уже учтено («не провели инструктаж»);
#   combos   — any и with в одном предложении («беруши» + «только через месяц»).
# level: red — обращение в HR сразу и уведомление в HR-группу; yellow — только отметка в карточке и сводке.
# notice — написать новичку «передал HR, увидит только HR»; emergency — всегда добавлять номер 112
#   (ночью 112 добавляется для любого красного флага).
# free_text — ловить и в свободных сообщениях (не в опросе), если в тексте есть «я / меня / мне…».

negations: [не, ни, нет, никто, никогда]
personal: '\b(я|меня|мне|мной|мой|моя|мое|мои|моего|моей|моих|моим|нас|нам|нами)\b'

categories:
  threats:
    topic: угрозы
    level: red
    notice: true
    emergency: true
    free_text: true
    stems: [угрож, угроз, шантаж, запугива, вымога, замахну]
    patterns:
      - '\b(убь|прибь|побь|пришь)(ю|ет|ют|ешь)\b'
      - '\bизобь'
      - '\b(у|при|по|из)бить\b'
      - 'грози\w*\s+(\w+\s+)?(побить|убить|избить|прибить|уволить|расправ|покалечить)'
      - '\b(тебе|мне|ему|ей|вам|нам) не жить\b'
      - '\bпокалеч'
      - '\bзареж'
      - '\bпожалеешь'
      - 'ноги (переломаю|сломаю|оторву)'
      - '\b(сломаю|сломают|сломаем|переломаю|переломают|оторву|оторвут)\s+(тебе |мне |ему |ей )?(ноги|руки|голову|челюсть)'
      - 'голову (оторву|откручу|проломлю)'
      - 'поговорим по-другому'
      - '(встретим|встречу|найдем|найду) (тебя )?после работы'
      - '\bудар(ил|ила|или|ит|ят)\b(?! током)'
      - '\bбь(ет|ют)\s+(меня|нас)|\b(меня|нас)\s+(\w+\s+)?бь(ет|ют)\b'
      - '\bтолкн(ул|ула|ули)\b'
      - '\b(швыр|кин|брос|запусти)\w*\s+в\s+(меня|нас)'
      - 'схватил\w* (меня )?за (руку|шиворот|грудки|одежд|плечо|горло)'
      - '\bоружи|с ножом'

  health:
    topic: здоровье
    level: red
    notice: true
    emergency: true
    free_text: false        # «я заболел, как оформить больничный?» — вопрос в базу знаний, не тревога
    stems:
      - болит
      - заболел
      - заболела
      - болею
      - головокруж
      - тошнит
      - тошнот
      - обморок
      - задыхаюсь
      - кровотеч
      - отравил
      - астм
      - суицид
      - депресс
    patterns:
      - '\bболи в\b'
      - 'плохо себя чувству'
      - 'плохое самочувствие'
      - 'кружится голова'
      - '(потерял|потеряла|теряю|терял)\w* сознани'
      - 'давлени\w* (скачет|скачут|поднял|поднима|высок|упал)'
      - 'сердце (колет|болит|прихват|сжима)'
      - '(не могу|трудно|тяжело) дышать'
      - 'кровь из носа'
      - '\b(ожог|обжег|обожгл|порезал|порезала)'
      - 'аллерги\w* на'
      - 'паническ\w* атак'
      - 'покончить с собой'
      - 'не хочу жить|жить не хочется|руки на себя'
      - '\bвызвал\w* скорую|\bскорую (вызва|помощь)'

  safety:
    topic: безопасность
    level: red
    notice: true
    emergency: false
    free_text: true
    stems: [травм, небезопасн, опасн, авари, возгоран, задымлен, неисправн]
    patterns:
      - '\bпожар\b'
      - 'несчастн\w* случа'
      - '(удар\w*|бь[её]т|дерга\w*|дернул\w*) током|током (удар|бь|дерн)'
      - 'сработал\w* защит'
      - '(без|нет|сняли) (ограждени|страховк)'
      - 'на высоте без'
      - 'голыми руками'
      - 'заставля\w* работать без'
      - 'нарушени\w* (техники безопасности|тб|охраны труда)'
      - 'наруша\w* (технику безопасности|тб|охрану труда)'
      - 'утечк\w* (газа|хими|аммиак|масла|кислот)'
    combos:
      - any: ['спецовк', 'спецодежд', '\bсиз\b', 'каск', 'перчатк', 'респиратор', 'беруш', 'наушник',
              'защитн\w* (очк|обув|костюм|маск)', 'очк\w* защитн', 'средств\w* (индивидуальной )?защит', 'ботинк']
        with: ['\bнет\b', 'не выда', 'не дал', 'не да(ют|ли)\b', '\bбез\b', 'только через', 'не по размеру', 'на (\d|два|три|пару) размер', 'порван',
               'сломан', 'не хвата', 'не положен', 'свои\w* (купи|покупа)']
      - any: ['инструктаж', 'охран\w* труда', 'техник\w* безопасност', '\bтб\b',
              'инструкци\w* по (оборудовани|эксплуатаци|охране|технике|безопасност|работе на)',
              'допуск\w* к (работ|станк|оборудовани)']
        with: ['не провел', 'не провод', 'не был', '\bнет\b', 'так и не', 'не прош', 'не дал', 'забыли',
               'не объясн', 'на немецк', 'на английск', 'не на русском', 'без\b', 'формальн', 'расписа\w* не читая']
      - any: ['\bцех', 'рабоч\w* мест', '\bсклад', 'на линии', 'участк', 'в помещени']
        with: ['холод', 'мороз', 'жара\b', 'жарко', 'духот', '\+\s?\d{1,2}\b', 'сквозняк', 'задыха', 'дым',
               '\bгаз\b', 'протека', 'скользк', 'нет освещени', 'темно', 'не работает вентиляц', 'вытяжк\w* не']
      - any: ['станк', 'станок', 'оборудовани', 'на линии', 'пресс', 'погрузчик', '\bкран', 'конвейер', 'электрощит']
        with: ['сломан', 'искрит', 'без ограждени', 'без защит', 'не обучен', 'без обучени', 'без допуск',
               'одного', 'одну', 'сам\w* разбира', 'сработал\w* защит', 'методом тыка']

  bullying:
    topic: травля
    level: red
    notice: true
    emergency: false
    free_text: true
    stems: [униж, оскорбл, травл, издева, насмеха, высмеива, обзыва, буллинг, моббинг, хамит, хамят, хамств,
            хамск, грубит, грубят, наорал, накричал, кричит, кричат, крик, гнобит, гнобят, гнобил,
            дискримин, домога, пристава, харассмент, бойкот, дедовщин]
    patterns:
      - '\bор(е|у)т\b'
      - '\bорал\w*\b'
      - '\bматер(ит|ят|ится|ятся|ился|ились|ил|ный|ные|щин)\b|\bмат(ом|ами)\b|\bматом\b'
      - '\bтравят\b|\bзатравил'
      - 'смеют\w* (надо мной|над нами|над новичк|над новеньк|когда (я )?спрашива)'
      - '\bподставля'
      - 'свалива\w* (вину|косяки|ошибки)'
      - 'не здорова(ются|ется)'
      - 'не разговарива\w* со мной'
      - 'меня\s+(\w+\s+)?не (добавили|позвали|берут|пускают|зовут)'
      - 'давят на меня|оказыва\w* давление|прессу(ют|ет|ешь)\b'
      - 'из-за (моей |моего )?(национальност|возраст|пола\b|внешност)'

  intent_to_leave:
    topic: намерение уйти
    level: yellow
    notice: false
    emergency: false
    free_text: false
    stems: [уволюсь, уволиться]
    patterns:
      - '(уйду|ухожу|уйти) (из|с) (компании|работы|этой|организации)'
      - 'по собственному'
      - 'заявлени\w* (на|об) увольнени'
      - 'напишу заявлени'
      - 'задумываюсь об уходе'
      - 'подумываю (уйти|об уходе|уволиться|сменить работу)'
      - 'ищу (другую |новую )?работу'
      - 'хожу (на|по) собеседовани'
      - 'рассматриваю (другие )?(предложени|вакансии|варианты)'
      - '(есть|получил|получила) оффер'
      - 'не вижу смысла (продолжать|оставаться|здесь)'
      - 'не (останусь|планирую оставаться|хочу (тут |здесь )?оставаться)'
      - '\bя так (больше )?не могу\b|\bтак больше не могу\b'
      - 'зачем (я )?(уш[её]л|ушла|перешел|перешла|сюда пришел|сюда пришла)'

# Не отправлять в облачную нейросеть (dev-plan 4.10): тема «здоровье» и близкие
sensitive:
  - 'болез|болею|болит|болел|заболел|больнич|диагноз|депресс|давлени|беремен|врач|лекарств|травм|инвалид'
  - 'психолог|психиатр|операци|госпитал|анализ\w* крови|самочувстви|тошн|обморок|суицид'
