# Маршрут вопроса в базе знаний (app/kb/route.py).
# Уверенность — лучшая косинусная близость вопроса к найденным пунктам (bge-m3).
# Подобрано на эталоне: python -m eval.run --llm --tune; таблица — eval/RESULTS.md.
answer_threshold: 0.68  # не ниже — отвечаем пунктом сразу
llm_threshold: 0.50     # от этого порога до answer_threshold — GigaChat выбирает пункт из топ-5; ниже — «не знаю», к HR
agree_direct: true      # пункт первый и в полнотекстовом, и в векторном поиске — отвечаем без GigaChat
llm_fallback_threshold: 0.60  # GigaChat недоступен: отвечаем лучшим пунктом только при такой близости, иначе к HR
