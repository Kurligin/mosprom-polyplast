# Поправки к импорту сценария Корсика (app/scenario/importer.py).
# Ключ — порядковый номер шага (StepSpec.number, 1..68), значение — поля шага.
# timing — правило TimingRule целиком: kind + параметры (+ time «HH:MM»).
# Поля: timing, office_only, gate, kind, site_tags.
# Все 68 времён разбираются правилами, поправки времени не нужны.
# Пример:
#   62:
#     timing: {kind: probation_end, offset_days: 0, time: "09:01"}
#   33:
#     office_only: true
steps:
  # «Подскажи, как идет работа по адаптационному плану?» с вариантами 1)–3) и ветками «Если 1-2 / Если 3» —
  # это опрос «адаптационный план» (первый день второго месяца), а не просто сообщение
  47:
    kind: survey
  # «Привет!» и «Мы подготовили небольшой опрос…» — подводка к опросу двух месяцев. Время в ТЗ не указано
  # (по умолчанию было бы 10:00), а сам опрос — «В 09.01». Ставим подводку на 09:00, чтобы она шла перед опросом
  51:
    timing: {kind: calendar_offset, months: 1, weeks: 3, time: "09:00"}
  52:
    timing: {kind: calendar_offset, months: 1, weeks: 3, time: "09:00"}
