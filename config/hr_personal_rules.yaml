# Правила личных кадровых случаев: такие вопросы сразу идут в HR, без поиска и LLM.
# Срабатывание: (первое лицо И тема из personal_topics) ИЛИ шаблон из always.
# Шаблоны — регулярные выражения Python по тексту в нижнем регистре (ё → е).

# Признаки первого лица (целые слова)
first_person: [я, мне, меня, мной, мною, мой, моя, мое, мои, моего, моей, моих, моему, нам, нас, наш, наша]

# Темы, которые вместе с первым лицом делают вопрос личным
personal_topics:
  - не (при|пришл|выплат|заплат|оплат|начисл|перечисл)\w*            # «не пришла зарплата», «не оплатили»
  - (задерж|недоплат|недоплач|урез|сниз|уменьш)\w*
  - начислил\w* меньше
  - (уволит|увольня|уволен|уволя|сократ|сокращ)\w*                    # «меня увольняют», «хотят уволить»; не «после увольнения»
  - (заплатят|выплатят|начислят|компенсир)\w*
  - (заболел|заболела|болею|болен|больна|больничн|температур|травм)\w*
  - (беремен|декрет)\w*
  - (выговор|взыскан|штраф|лишил|лишат|депремир)\w*
  - (конфликт|оскорбл|орет|кричит|унижа|угрожа|травл|домогател)\w*
  - (перевест|перевод|перевели)\w*
  - (суд|прокуратур|инспекци|жалоб)\w*
  - (ночь|ночн)\w* .*(подряд|не выдерж)
  - (не выдерживаю|плохо|депресс|выгор)\w*
  - (мою|моя|мой|моей) (зарплат|премии|премию|оклад|ставк)\w*

# Всегда к HR, даже без первого лица: чужие персональные данные, нарушения, безопасность
always:
  - (зарплат|оклад|получает)\w* .*(коллег|иванов|петров|сидоров|соседа)
  - коллег\w* .*(зарплат|получает|ворует|крад)
  - (ворует|воруют|кража|крадут)
  - без сиз
  - (заставляет|заставляют) .*(работать|выходить)
  - (не выплат|невыплат)\w*
